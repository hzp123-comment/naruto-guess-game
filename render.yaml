services:
  - type: web
    name: naruto-guess-game
    env: node
    region: singapore
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: node server/scripts/render-probe.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: sqlite
      - key: DB_URL
        value: /tmp/naruto-guess.sqlite3
      - key: REDIS_REQUIRED
        value: false
      - key: POW_DIFFICULTY
        value: "17"
      - key: CORS_ORIGINS
        value: "*"
      - key: TRUST_PROXY
        value: "true"
    healthCheckPath: /api/health
    autoDeploy: true
